<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PILIH #3</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style type="text/tailwindcss">
    /* ── Design Tokens ─────────────────────────────────────── */
    @theme {
      /* Colors */
      --color-parchment:       #fcf9f0;
      --color-parchment-mid:   #f1eee5;
      --color-parchment-dark:  #e5e2da;
      --color-ink:             #1c1c17;
      --color-ink-muted:       #5d3f3b;
      --color-haki-red:        #910000;
      --color-haki-red-vivid:  #be0000;
      --color-haki-light:      #ffcac2;
      --color-grand-gold:      #fed65b;
      --color-grand-gold-dim:  #e9c349;
      --color-gold-text:       #735c00;
      --color-outline:         #926f69;

      /* Typography */
      --font-display:   "Anton", sans-serif;
      --font-mono:      "JetBrains Mono", monospace;

      /* Spacing */
      --spacing-gutter:  24px;
    }

    /* ── Base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: var(--font-mono);
      background-color: var(--color-parchment);
      color: var(--color-ink);
      overflow-x: hidden;
    }
*{
          scroll-behavior: smooth;

}

    #hero-candidate-name {
      display: inline-block;
      min-height: 1.3em;
      white-space: nowrap;
      position: relative;
    }

    #hero-candidate-name::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: var(--color-ink);
      vertical-align: -0.1em;
      margin-left: 0.12em;
      animation: blink-cursor 0.8s steps(1, end) infinite;
    }

    @keyframes blink-cursor {
      50% { opacity: 0; }
    }
    ::selection {
      background-color: var(--color-haki-red-vivid);
      color: #fff;
    }

    /* ── Typography helpers ─────────────────────────────────── */
    .font-display   { font-family: var(--font-display); }
    .font-mono      { font-family: var(--font-mono); }

    /* ── Brutalist components ───────────────────────────────── */

    /* Wanted card frame */
    .wanted-card {
      border: 8px solid var(--color-ink);
      box-shadow: 8px 8px 0 0 var(--color-ink);
      background-color: var(--color-parchment);
    }

    /* Standard card frame */
    .card {
      border: 4px solid var(--color-ink);
      box-shadow: 4px 4px 0 0 var(--color-ink);
    }

    /* Hard-shadow lift (used on program cards) */
    .shadow-lift-bg {
      position: absolute;
      inset: 0;
      background-color: var(--color-ink);
      transform: translate(8px, 8px);
      transition: transform 0.15s ease;
    }
    .group:hover .shadow-lift-bg {
      transform: translate(10px, 10px);
    }

    /* Primary button */
    .btn-primary {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 1.25rem;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      background-color: var(--color-haki-red-vivid);
      color: #fff !important;
      border: 4px solid var(--color-ink);
      box-shadow: 4px 4px 0 0 var(--color-ink);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      text-decoration: none;
      line-height: 1;
    }
    .btn-primary:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 0 var(--color-ink);
    }

    /* Secondary button */
    .btn-secondary {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 1.25rem;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      background-color: var(--color-grand-gold);
      color: var(--color-gold-text);
      border: 4px solid var(--color-ink);
      box-shadow: 4px 4px 0 0 var(--color-ink);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      text-decoration: none;
      line-height: 1;
    }
    .btn-secondary:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 0 var(--color-ink);
    }

    /* Ghost button (dark bg variant) */
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.75rem 1.5rem;
      background-color: var(--color-parchment);
      color: var(--color-ink);
      border: 4px solid var(--color-parchment);
      box-shadow: 4px 4px 0 0 var(--color-haki-red-vivid);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      text-decoration: none;
    }
    .btn-ghost:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 0 0 var(--color-haki-red-vivid);
    }

    /* Chip / tag */
    .chip {
      display: inline-block;
      background-color: var(--color-ink);
      color: var(--color-parchment);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
    }

    /* FAQ Details */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] summary .faq-arrow { transform: rotate(180deg); }
    .faq-arrow { transition: transform 0.2s ease; }

    /* Section divider */
    .section-divider {
      border-top: 8px solid var(--color-ink);
    }

    /* Nav active link */
    .nav-link-active {
      color: var(--color-haki-red);
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 6px;
    }

    /* Material icons baseline align */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      line-height: 1;
    }

    /* Image placeholder box */
    .img-placeholder {
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: var(--color-parchment-dark);
      border: 4px solid var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-ink-muted);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .img-placeholder img[src=""] { display: none; }
    .img-placeholder:has(img[src=""]) {}

    /* Logo placeholder */
    .logo-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background-color: var(--color-parchment-dark);
      border: 4px solid var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-ink-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    /* Responsive helpers */
    html { scroll-padding-top: 88px; }
    img { max-width: 100%; }

    #mobile-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #mobile-links a {
      padding: 0.5rem 0;
      font-size: 1rem !important;
    }

    #countdown-wrap {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(100%, 1000px);
      margin-left: auto;
      margin-right: auto;
      position: relative;
      z-index: 1;
    }

    #countdown-label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #000000;
      text-align: center;
    }

    #countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .countdown-box {
      background-color: var(--color-parchment);
      border: 4px solid var(--color-haki-red-vivid);
      box-shadow: 6px 6px 0 0 var(--color-grand-gold);
      padding: 1rem 0.75rem;
      text-align: center;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .countdown-number {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }

    .countdown-text {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--color-ink-muted);
      letter-spacing: 0.08em;
    }

    #misi-grid > div:nth-child(4),
    #misi-grid > div:nth-child(5) {
      grid-column: span 3;
      width: 100%;
      justify-self: stretch;
    }

    #mobile-cta .btn-primary {
      width: 100%;
      text-align: center;
    }

    @media (max-width: 1100px) {
      #nav { padding-left: 2rem !important; padding-right: 2rem !important; }
      #hero { padding-left: 2rem !important; padding-right: 2rem !important; }
      #hero-headline { font-size: clamp(3.5rem, 7vw, 5.25rem) !important; line-height: 0.98 !important; }
      #program-grid { gap: 2rem !important; }
    }

    @media (min-width: 768px) and (max-width: 900px) {
      #nav { padding-left: 1rem !important; padding-right: 1rem !important; }
      #nav-links { gap: 0.75rem !important; }
      #nav-links a { font-size: 0.72rem !important; }
      #nav-links .btn-primary { color:white;padding: 0.45rem 0.75rem !important; font-size: 0.72rem !important; }
    }

    @media (max-width: 767px) {
      html { scroll-padding-top: 76px; }
      #nav { min-height: 68px; padding: 0.75rem 1rem !important; }
      #nav-brand { font-size: 1.15rem !important; max-width: 70%; line-height: 1.1; }
      #nav-toggle { display: block !important; }
      #mobile-menu { top: 68px !important; padding: 1rem !important; }

      #hero {
        min-height: auto !important;
        padding: 6rem 1rem 4rem !important;
        gap: 3rem !important;
      }
      #hero > div:first-child { width: 100%; }
      .hero-headline, #hero-headline { font-size: clamp(3rem, 14vw, 4.25rem) !important; line-height: 0.98 !important; letter-spacing: 0.02em !important; }
      #hero-candidate-name { font-size: 1.5rem !important; }
      #hero-tagline { font-size: 1rem !important; line-height: 1.55 !important; }
      #hero-cta { width: 100%; }
      #hero-cta a { flex: 1 1 100%; text-align: center; }
      #hero > div:last-child { width: min(100%, 360px); max-width: none !important; }
      #hero > div:last-child > div:first-child { left: -12px !important; }
      #hero > div:last-child > div:nth-child(2) { right: -12px !important; }
      #hero > div:last-child .wanted-card { width: 88% !important; }
      #poster-label { font-size: 2.2rem !important; }

      section { padding-top: 3.5rem !important; padding-bottom: 3.5rem !important; }
      section h2 { font-size: clamp(2rem, 10vw, 3rem) !important; line-height: 1.05 !important; margin-bottom: 2rem !important; }
      #visi-card { padding: 2rem 1rem !important; }
      #visi-text { font-size: clamp(1.35rem, 7vw, 2rem) !important; }
      #misi-grid, #timeline-grid, #program-grid { grid-template-columns: 1fr !important; gap: 1.5rem !important; }
      #misi-grid > div:nth-child(4),
      #misi-grid > div:nth-child(5) {
        grid-column: auto !important;
        width: 100% !important;
        justify-self: stretch !important;
      }
      #prestasi > div { flex-direction: column !important; align-items: stretch !important; }
      #prestasi > div > div { width: 100% !important; min-width: 0 !important; }
      #misi-grid .wanted-card, #program-grid > .group > div:last-child { padding: 1.5rem !important; }
      #timeline-grid > div { width: 100%; }
      #faq-title { padding-bottom: 0.35rem !important; }
      #faq-list { gap: 1rem !important; }
      #faq-list summary { padding: 1rem !important; font-size: 1.05rem !important; }
      #faq-list summary span:first-child { min-width: 0; }
      #faq-list div > div { padding-left: 1rem !important; padding-right: 1rem !important; font-size: 0.95rem !important; line-height: 1.55 !important; }

      #team > div {
        grid-template-columns: 1fr !important;
        width: 100% !important;
      }
      #team > div > div {
        width: 100% !important;
        max-width: 100% !important;
        transform: none !important;
      }

      #kontak > div:nth-child(2) { flex-direction: column !important; align-items: stretch !important; }
      #kontak > div:nth-child(2) > div { min-width: 0 !important; width: 100%; }
      #cta-card { width: min(100%, 280px) !important; align-self: center; margin: 0 auto; }
      #cta-headline { font-size: clamp(2.5rem, 13vw, 4rem) !important; }
      footer { align-items: stretch !important; }
      #footer-copyright { line-height: 1.5; overflow-wrap: anywhere; }
      #footer-links { gap: 0.75rem 1rem !important; }
    }
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════
       NAVIGATION
  ════════════════════════════════════════════════════════ -->
  <nav id="nav" style="
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 4rem;
    background-color: var(--color-parchment);
    border-bottom: 4px solid var(--color-ink);
    box-shadow: 0 4px 0 0 var(--color-ink);
  ">
    <!-- Brand -->
    <a id="nav-brand" href="#" style="
      font-family: var(--font-display);
      font-size: 1.5rem;
      text-transform: uppercase;
      color: var(--color-haki-red);
      text-decoration: none;
      letter-spacing: 0.02em;
    "></a>

    <!-- Links (desktop) -->
    <div id="nav-links" style="display: flex; gap: 2rem; align-items: center;"></div>

    <!-- Mobile menu toggle -->
    <button id="nav-toggle" onclick="toggleMobileMenu()" style="
      display: none;
      font-family: var(--font-display);
      font-size: 1rem;
      background: none;
      border: 3px solid var(--color-ink);
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
    ">MENU</button>
  </nav>

  <!-- Mobile menu -->
  <div id="mobile-menu" style="
    display: none;
    position: fixed; top: 73px; left: 0; right: 0; z-index: 40;
    background-color: var(--color-parchment);
    border-bottom: 4px solid var(--color-ink);
    padding: 1.5rem 1rem;
    flex-direction: column; gap: 1.5rem;
  ">
    <div id="mobile-links"></div>
    <div id="mobile-cta"></div>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       HERO
  ════════════════════════════════════════════════════════ -->
  <section id="hero" style="
    min-height: 100vh;
    padding-top: 6rem;
    padding-bottom: 5rem;
    padding-left: 4rem;
    padding-right: 4rem;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-gutter);
  ">
    <!-- Left: Copy -->
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1.5rem; position: relative; z-index: 1;">
      <span id="hero-eyebrow" class="chip" style="align-self: flex-start;"></span>

      <h1 id="hero-headline" class="font-display hero-headline" style="
        font-size: 50px;
        line-height: 70px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--color-ink);
        text-shadow: 2px 2px 0 #000;
        max-width: 600px;
      ">
        <span id="hero-h1-part1"></span>
        <span id="hero-h1-part2" style="color: var(--color-haki-red-vivid);"></span>
      </h1>

      <h2 id="hero-candidate-name" class="font-display" style="
        font-size: 2rem;
        line-height: 1.1;
        text-transform: uppercase;
        color: var(--color-ink-muted);
        letter-spacing: 0.02em;
      "></h2>

      <p id="hero-tagline" style="
        font-size: 1.125rem;
        line-height: 1.75rem;
        font-weight: 500;
        max-width: 520px;
        color: var(--color-ink);
      "></p>

      <div id="hero-cta" style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;"></div>
    </div>

    <!-- Right: Wanted Poster -->
    <div style="flex: 1; display: flex; justify-content: center; position: relative; max-width: 420px;">
      <!-- Decorative bg squares -->
      <div style="
        position: absolute; z-index: 0;
        top: 40px; left: -40px;
        width: 112px; height: 112px;
        background-color: var(--color-grand-gold);
        border: 4px solid var(--color-ink);
        transform: rotate(12deg);
      "></div>
      <div style="
        position: absolute; z-index: 0;
        bottom: 40px; right: -40px;
        width: 80px; height: 80px;
        background-color: var(--color-haki-light);
        border: 4px solid var(--color-ink);
        border-radius: 50%;
        transform: rotate(-12deg);
      "></div>

      <!-- Poster card -->
      <div class="wanted-card" style="
        padding: 1rem;
        transform: rotate(3deg);
        transition: transform 0.3s ease;
        position: relative; z-index: 1;
        width: 70%;
        ;
      " onmouseover="this.style.transform='rotate(0deg)'" onmouseout="this.style.transform='rotate(3deg)'">
        <!-- Poster header -->
        <div id="poster-label" class="font-display" style="
          background-color: var(--color-haki-red-vivid);
          color: #fff;
          text-align: center;
          padding: 0.5rem;
          margin-bottom: 1rem;
          border: 4px solid var(--color-ink);
          font-size: 3rem;
          line-height: 1;
          letter-spacing: 0.02em;
          text-transform: uppercase;
        "></div>

        <!-- Photo area -->
        <div id="poster-photo-wrap" class="img-placeholder" style="overflow: hidden;">
          <img id="poster-photo" src="" alt="" style="
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(1) contrast(1.25);
          " />
          <span id="poster-photo-fallback" style="position: absolute;">[ FOTO KANDIDAT ]</span>
        </div>

        <!-- Reward row -->
        <div style="
          margin-top: 1rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
        ">
          <span id="poster-reward-label" class="font-display" style="
            font-size: 1.25rem;
            text-transform: uppercase;
            color: var(--color-ink-muted);
            display: flex; align-items: center; gap: 0.5rem;
          ">
            <span class="material-symbols-outlined">payments</span>
          </span>
          <span id="poster-reward-value" class="font-display" style="
            font-size: 1.25rem;
            color: var(--color-ink);
          "></span>
        </div>
      </div>
    </div>
  </section>


  <!-- ═══════════════════════════════════════════════════════
       VISI & MISI
  ════════════════════════════════════════════════════════ -->
  <section id="misi" class="section-divider" style="
    padding: 5rem 4rem;
    background-color: var(--color-parchment);
  ">
    <h2 id="misi-title" class="font-display" style="
      font-size: 3rem;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 3rem;
      color: var(--color-ink);
    "></h2>

    <div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--spacing-gutter);">

      <!-- Visi hero card -->
      <div id="visi-card" class="wanted-card" style="
        padding: 3rem;
        background-color: var(--color-haki-red-vivid);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      ">
        <span class="material-symbols-outlined" style="font-size: 3.5rem; margin-bottom: 1rem;">sailing</span>
        <p style="font-family: var(--font-mono); font-size: 0.875rem; font-weight: 700; text-transform: uppercase; opacity: 0.8; margin-bottom: 1rem;">VISI</p>
        <p id="visi-text" class="font-display" style="
          font-size: clamp(1.2rem, 2vw, 2rem);
          line-height: 1.1;
          text-transform: uppercase;
        "></p>
      </div>

      <!-- Misi cards grid -->
      <div id="misi-grid" style="
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--spacing-gutter);
        align-items: stretch;
      "></div>

    </div>
    <br>
    <br>
    <div id="countdown-wrap">
      <div id="countdown-label">Jangan lewatkan — Pencoblosan dimulai</div>
      <div id="countdown-grid">
        <div class="countdown-box">
          <div id="countdown-days" class="countdown-number">00</div>
          <div class="countdown-text">Hari</div>
        </div>
        <div class="countdown-box">
          <div id="countdown-hours" class="countdown-number">00</div>
          <div class="countdown-text">Jam</div>
        </div>
        <div class="countdown-box">
          <div id="countdown-minutes" class="countdown-number">00</div>
          <div class="countdown-text">Menit</div>
        </div>
        <div class="countdown-box">
          <div id="countdown-seconds" class="countdown-number">00</div>
          <div class="countdown-text">Detik</div>
        </div>
      </div>
    </div>
  </section>


  <!-- ═══════════════════════════════════════════════════════
       PROFIL KANDIDAT
  ════════════════════════════════════════════════════════ -->
  <section id="prestasi" class="section-divider" style="
    padding: 5rem 4rem;
    background-color: var(--color-parchment);
  ">
    <div style="max-width: 1100px; margin: 0 auto;">
      <h2 id="kandidat-title" class="font-display" style="
        font-size: 3rem;
        line-height: 1;
        letter-spacing: 0.02em;

  function setupImagePlaceholder(imgId, fallbackId, src, alt) {
    const img = el(imgId);
    const fallback = el(fallbackId);
    if (!img || !fallback) return;
    if (src && src.trim() !== '') {
      img.src = src;
      img.alt = alt || '';
      img.style.display = 'block';
      fallback.style.display = 'none';
    } else {
      img.style.display = 'none';
      fallback.style.display = 'block';
    }
  }

  /* ──────────────────────────────────────────────────────────
     HERO
  ────────────────────────────────────────────────────────── */
  function startTypingLoop(elementId, textValue, delay = 90, pause = 900) {
    const target = el(elementId);
    if (!target) return;

    let i = 0;
    let deleting = false;

    function tick() {
      if (!deleting) {
        target.textContent = textValue.slice(0, i + 1);
        i += 1;

        if (i >= textValue.length) {
          deleting = true;
          setTimeout(tick, pause);
          return;
        }
      } else {
        target.textContent = textValue.slice(0, i - 1);
        i -= 1;

        if (i <= 0) {
          deleting = false;
          setTimeout(tick, 180);
          return;
        }
      }

      setTimeout(tick, deleting ? delay / 2 : delay);
    }

    tick();
  }

  function renderProgram() {
    const d = SITE_DATA.program;
    text('program-title', d.sectionTitle);

    const grid = el('program-grid');
    const programBg = {
      surface:   'var(--color-parchment)',
      secondary: 'var(--color-grand-gold)',
      primary:   'var(--color-haki-red-vivid)',
    };

    d.items.forEach(item => {
      const bg = programBg[item.variant] || programBg.surface;
      const isLight = item.variant === 'primary';

      const wrapper = document.createElement('div');
      wrapper.className = 'group';
      wrapper.style.cssText = 'position: relative; height: 100%;';

      wrapper.innerHTML = `
        <div class="shadow-lift-bg"></div>
        <div style="
          position: relative;
          background-color: ${bg};
          border: 4px solid var(--color-ink);
          padding: 2rem 1.75rem 2rem;
          display: flex;
          flex-direction: column;
          z-index: 1;
          min-height: 440px;
          ${isLight ? 'color: #fff;' : 'color: var(--color-ink);'}
        ">
          <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
          ">
            <span class="material-symbols-outlined" style="
              font-size: 3.2rem;
              width: 76px;
              height: 76px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              color: ${isLight ? '#fff' : '#fff'};
              background-color: ${isLight ? 'rgba(255,255,255,0.12)' : 'var(--color-haki-red-vivid)'};
              border: 4px solid var(--color-ink);
              box-shadow: 4px 4px 0 0 var(--color-ink);
              transform: rotate(-2deg);
            ">${item.icon}</span>
          </div>

          <h3 style="
            font-family: var(--font-display);
            font-size: clamp(2rem, 2vw, 2.8rem);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 0.96;
            margin: 0 0 1.4rem 0;
            word-break: break-word;
          ">${item.judul}</h3>

          <p style="
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 0;
            flex: 1;
            max-width: 28ch;
          ">${item.deskripsi}</p>
        </div>
      `;
      grid.appendChild(wrapper);
    });
  }

  /* ──────────────────────────────────────────────────────────
     FAQ
  ────────────────────────────────────────────────────────── */
  function renderFaq() {
    const d = SITE_DATA.faq;
    text('faq-title', d.sectionTitle);

    const list = el('faq-list');
    d.items.forEach(item => {
      const wrap = document.createElement('div');
      wrap.className = 'card';
      wrap.style.cssText = `
        background-color: var(--color-parchment-mid);
        box-shadow: 4px 4px 0 0 var(--color-ink);
      `;

      const details = document.createElement('details');

      const summary = document.createElement('summary');
      summary.style.cssText = `
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem;
        cursor: pointer;
        font-family: var(--font-display);
        font-size: 1.25rem;
        text-transform: uppercase;
        gap: 1rem;
        user-select: none;
      `;
      summary.innerHTML = `
        <span>${item.pertanyaan}</span>
        <span class="material-symbols-outlined faq-arrow" style="font-size: 2rem; flex-shrink: 0;">arrow_drop_down</span>
      `;

      const body = document.createElement('div');
      body.style.cssText = `
        padding: 0 1.5rem 1.5rem;
        border-top: 4px solid var(--color-ink);
        margin-top: 0;
        padding-top: 1.5rem;
        background-color: var(--color-parchment);
        font-size: 1.05rem;
        line-height: 1.75rem;
        font-weight: 500;
      `;
      body.textContent = item.jawaban;

      details.appendChild(summary);
      details.appendChild(body);
      wrap.appendChild(details);
      list.appendChild(wrap);
    });
  }

  /* ──────────────────────────────────────────────────────────
     KONTAK / CTA
  ────────────────────────────────────────────────────────── */
  function renderKontak() {
    const d = SITE_DATA.kontak;
    text('cta-headline', d.headline);
    text('cta-subtext',  d.subtext);

    const socialWrap = el('cta-social');
    d.socialLinks.forEach(s => {
      const a = document.createElement('a');
      a.href = s.href;
      a.className = 'btn-ghost';
      a.innerHTML = `<span class="material-symbols-outlined">${s.icon}</span> ${s.label}`;
      socialWrap.appendChild(a);
    });

    // CTA card
    const card = d.ctaCard;
    setupImagePlaceholder('cta-logo', 'cta-logo-fallback', card.logoSrc, card.logoAlt);

    const ctaCardBtn = el('cta-card-btn');
    // ctaCardBtn.href = card.ctaHref;
    ctaCardBtn.textContent = "Ayo pilih #3";
    ctaCardBtn.style.width = '100%';
    ctaCardBtn.style.textAlign = 'center';
  }

  function startCountdown(targetDateString) {
    const targetDate = new Date(targetDateString);
    const daysEl = el('countdown-days');
    const hoursEl = el('countdown-hours');
    const minutesEl = el('countdown-minutes');
    const secondsEl = el('countdown-seconds');

    if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

    function update() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = String(days).padStart(2, '0');
      hoursEl.textContent = String(hours).padStart(2, '0');
      minutesEl.textContent = String(minutes).padStart(2, '0');
      secondsEl.textContent = String(seconds).padStart(2, '0');
    }

    update();
    setInterval(update, 1000);
  }

  /* ──────────────────────────────────────────────────────────
     FOOTER
  ────────────────────────────────────────────────────────── */
  function renderFooter() {
    const d = SITE_DATA.footer;
    text('footer-brand',     d.brandName);
    text('footer-copyright', d.copyright);

    const linksEl = el('footer-links');
    if (linksEl && Array.isArray(d.links)) {
      d.links.forEach(link => {
        const a = document.createElement('a');
        a.href = link.href;
        a.textContent = link.label;
        a.style.cssText = `
          font-family: var(--font-mono);
          font-size: 0.875rem;
          font-weight: 700;
          text-transform: uppercase;
          color: var(--color-parchment-dark);
          text-decoration: none;
          transition: color 0.1s, transform 0.1s;
        `;
        a.onmouseover = () => { a.style.color = 'var(--color-haki-red-vivid)'; a.style.transform = 'skewX(-3deg)'; };
        a.onmouseout  = () => { a.style.color = 'var(--color-parchment-dark)'; a.style.transform = 'skewX(0)'; };
        linksEl.appendChild(a);
      });
    }
  }

  /* ──────────────────────────────────────────────────────────
     MOBILE RESPONSIVENESS
  ────────────────────────────────────────────────────────── */
  function applyResponsive() {
    const isMobile = window.innerWidth < 768;

    // Nav
    el('nav').style.padding = isMobile ? '1rem' : '1rem 4rem';
    el('nav-links').style.display = isMobile ? 'none' : 'flex';
    el('nav-toggle').style.display = isMobile ? 'block' : 'none';
    if (!isMobile) closeMobileMenu();

    // Hero
    const heroSection = el('hero');
    heroSection.style.flexDirection = isMobile ? 'column' : 'row';
    heroSection.style.paddingLeft   = isMobile ? '1rem' : '4rem';
    heroSection.style.paddingRight  = isMobile ? '1rem' : '4rem';
    heroSection.style.paddingTop    = isMobile ? '5rem' : '7rem';

    // Other sections
    ['misi','prestasi','timeline','program','faq','kontak'].forEach(id => {
      const s = el(id);
      if (s) {
        s.style.paddingLeft  = isMobile ? '1rem' : '4rem';
        s.style.paddingRight = isMobile ? '1rem' : '4rem';
      }
    });

    const teamGrid = el('team-grid');
    if (teamGrid) {
      teamGrid.style.gridTemplateColumns = isMobile ? '1fr' : 'repeat(2, minmax(280px, 1fr))';
      teamGrid.style.width = isMobile ? '100%' : 'min(100%, 980px)';
    }

    const teamCards = document.querySelectorAll('#team-grid > div');
    teamCards.forEach(card => {
      if (isMobile) {
        card.style.width = '100%';
        card.style.maxWidth = '100%';
        card.style.transform = 'none';
      } else {
        card.style.width = '';
        card.style.maxWidth = '';
      }
    });

    // Footer
    const footer = document.querySelector('footer');
    if (footer) {
      footer.style.padding = isMobile ? '2rem 1rem' : '3rem 4rem';
      footer.style.flexDirection = isMobile ? 'column' : 'row';
    }

    // Timeline line (only on desktop)
    const tLine = el('timeline-line');
    if (tLine) tLine.style.display = isMobile ? 'none' : 'block';
  }

  function toggleMobileMenu() {
    const menu = el('mobile-menu');
    const open = menu.style.display === 'flex';
    menu.style.display = open ? 'none' : 'flex';
  }

  function isWebsiteClosed() {
    const now = new Date();
    return now.getMonth() === 8 && now.getDate() >= 1;
  }

  function showClosedPage() {
    document.body.innerHTML = `
      <main style="
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1c1c17;
        color: #fcf9f0;
        font-family: 'JetBrains Mono', monospace;
        padding: 2rem;
      ">
        <div style="
          max-width: 760px;
          text-align: center;
          border: 6px solid #fcf9f0;
          background: #910000;
          box-shadow: 12px 12px 0 0 #fed65b;
          padding: 2.5rem 2rem;
        ">
          <div style="font-size: 1rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.9; margin-bottom: 1rem;">
            Mohon maaf !
          </div>
          <div style="font-size: clamp(1.6rem, 4vw, 3rem); line-height: 1.3; font-weight: 700; text-transform: uppercase;">
            Web sedang di tutup
            </div>
        </div>
      </main>
    `;
  }

  /* ──────────────────────────────────────────────────────────
     INIT
  ────────────────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    if (!isWebsiteClosed()) {
      showClosedPage();
      return;
    }

    renderNav();
    renderHero();
    renderMisi();
    renderKandidat();
    renderTimeline();
    renderProgram();
    renderFaq();
    renderKontak();
    startCountdown('2026-09-02T00:00:00+07:00');
    renderFooter();
    applyResponsive();
    window.addEventListener('resize', applyResponsive);

    const sections = ['hero', 'prestasi', 'misi', 'program', 'kontak']
      .map(id => el(id))
      .filter(Boolean);
    const observer = new IntersectionObserver(entries => {
      const visible = entries
        .filter(entry => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) updateActiveNavLink(`#${visible.target.id}`);
    }, { rootMargin: '-25% 0px -55% 0px', threshold: [0, 0.25, 0.5, 1] });
    sections.forEach(section => observer.observe(section));
  });
  </script>
</body>
</html>
